<app-modal
  [open]="operation() !== null"
  title="تعديل عملية خزينة"
  size="md"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="close()"
>
  @if (operation(); as op) {
    <div class="mb-3" style="font-size:11px;color:var(--txt2)">
      #{{ op.id }} — {{ op.treasuryName }}
      @if (op.partyName) {
        · {{ op.partyName }}
      }
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="off">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">المبلغ</label>
        <div class="input-group">
          <input
            type="number"
            class="form-control"
            formControlName="amount"
            min="0.01"
            step="0.01"
            inputmode="decimal"
            dir="ltr"
            [class.is-invalid]="isInvalid('amount')"
          />
          <span class="input-group-text">ج.م</span>
        </div>
        <app-form-error [control]="form.controls.amount" label="المبلغ" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">التاريخ</label>
        <input type="date" class="form-control" formControlName="date" />
      </div>

      <div class="col-12">
        <label class="form-label">الملاحظات</label>
        <textarea class="form-control" rows="2" formControlName="notes"></textarea>
      </div>
    </div>

    @if (serverError(); as msg) {
      <div class="alert alert-danger mt-3 mb-0" role="alert" style="font-size:11px;">
        {{ msg }}
      </div>
    }
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn" [disabled]="submitting()" (click)="close()">
      إلغاء
    </button>

    <button
      type="button"
      class="btn btn-bl d-inline-flex align-items-center gap-2"
      [disabled]="submitting() || form.invalid"
      (click)="onSubmit()"
    >
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      }
      <span>{{ submitting() ? 'جاري الحفظ...' : 'حفظ التعديلات' }}</span>
    </button>
  </ng-container>
</app-modal>
