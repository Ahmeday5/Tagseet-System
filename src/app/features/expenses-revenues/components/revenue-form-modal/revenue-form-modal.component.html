<app-modal
  [open]="open()"
  title="إيراد جديد"
  size="md"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="close()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="off">
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label">المبلغ <span class="text-danger">*</span></label>
        <input
          type="number"
          class="form-control"
          formControlName="amount"
          min="0.01"
          step="0.01"
          dir="ltr"
          placeholder="0.00"
          [class.is-invalid]="isInvalid('amount')"
        />
        <app-form-error [control]="form.controls.amount" label="المبلغ" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">التاريخ</label>
        <input type="date" class="form-control" formControlName="date" dir="ltr" />
      </div>

      <div class="col-12">
        <label class="form-label">الخزينة <span class="text-danger">*</span></label>
        <app-searchable-select
          formControlName="treasuryId"
          [options]="treasuries()"
          placeholder="اختر الخزينة"
          searchPlaceholder="ابحث باسم الخزينة…"
        />
        <app-form-error [control]="form.controls.treasuryId" label="الخزينة" />
      </div>

      <div class="col-12">
        <label class="form-label">ملاحظات</label>
        <input
          type="text"
          class="form-control"
          formControlName="notes"
          autocomplete="off"
          placeholder="(اختياري)"
        />
      </div>
    </div>

    @if (serverError(); as msg) {
      <div class="alert alert-danger mt-3 mb-0" role="alert" style="font-size:11px;">
        {{ msg }}
      </div>
    }
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn" [disabled]="submitting()" (click)="close()">
      إلغاء
    </button>
    <button
      type="button"
      class="btn btn-bl d-inline-flex align-items-center gap-2"
      [disabled]="submitting()"
      (click)="onSubmit()"
    >
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      }
      <span>{{ submitting() ? 'جاري الحفظ...' : 'حفظ الإيراد' }}</span>
    </button>
  </ng-container>
</app-modal>
