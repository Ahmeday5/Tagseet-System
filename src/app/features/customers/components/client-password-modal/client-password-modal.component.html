<app-modal
  [open]="open()"
  [title]="'تغيير كلمة مرور' + (client() ? ' — ' + client()!.fullName : '')"
  size="sm"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="close()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="off">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">كلمة المرور الجديدة</label>
        <app-password-input
          formControlName="newPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <app-form-error [control]="form.controls.newPassword" label="كلمة المرور الجديدة" />
      </div>

      <div class="col-12">
        <label class="form-label">تأكيد كلمة المرور</label>
        <app-password-input
          formControlName="confirmPassword"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <app-form-error [control]="form.controls.confirmPassword" label="تأكيد كلمة المرور" />
        @if (showMismatch()) {
          <div class="invalid-feedback d-block" style="font-size:10.5px;">
            كلمتا المرور غير متطابقتين
          </div>
        }
      </div>
    </div>

    @if (serverError(); as msg) {
      <div class="alert alert-danger mt-3 mb-0" role="alert" style="font-size:11px;">
        {{ msg }}
      </div>
    }
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn" [disabled]="submitting()" (click)="close()">
      إلغاء
    </button>
    <button
      type="button"
      class="btn btn-bl d-inline-flex align-items-center gap-2"
      [disabled]="submitting() || form.invalid"
      (click)="onSubmit()"
    >
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      }
      <span>{{ submitting() ? 'جاري الحفظ...' : 'حفظ كلمة المرور' }}</span>
    </button>
  </ng-container>
</app-modal>
